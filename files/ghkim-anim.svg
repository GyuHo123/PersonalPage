<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI infrastructure lattice mark">
  <title>AI infrastructure lattice mark</title>
  <desc>Original animated lattice showing inference cores, evidence paths, and connected AI infrastructure.</desc>
  <style>
    :root { color-scheme: dark; }
    .lattice-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pathLength: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: lattice-draw 6.4s ease-in-out infinite alternate;
    }
    .lattice-line.cyan { stroke: rgba(125, 249, 255, 0.84); stroke-width: 4.5; }
    .lattice-line.violet { stroke: rgba(142, 113, 255, 0.76); stroke-width: 4; animation-delay: 0.22s; }
    .lattice-line.gold { stroke: rgba(247, 155, 18, 0.82); stroke-width: 4; animation-delay: 0.38s; }
    .neural-node {
      fill: #060915;
      stroke: #7df9ff;
      stroke-width: 3.5;
      transform-origin: center;
      animation: node-scan 3.2s ease-in-out infinite;
    }
    .neural-node.gold { stroke: #f79b12; animation-delay: .35s; }
    .neural-node.violet { stroke: #8e71ff; animation-delay: .7s; }
    .inference-core {
      fill: url(#coreGradient);
      stroke: rgba(255,255,255,.88);
      stroke-width: 2;
      animation: core-glow 4s ease-in-out infinite;
    }
    @keyframes lattice-draw {
      0% { stroke-dashoffset: 1; opacity: 0.1; }
      18% { opacity: 1; }
      64%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes node-scan {
      0%, 100% { opacity: .55; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes core-glow {
      0%, 100% { opacity: .82; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lattice-line,
      .neural-node,
      .inference-core {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
  <defs>
    <linearGradient id="coreGradient" x1="520" y1="280" x2="680" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="0.52" stop-color="#8e71ff"/>
      <stop offset="1" stop-color="#f79b12"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#05070d"/>
  <g filter="url(#glow)">
    <path class="lattice-line cyan" pathLength="1" d="M190 168 H396 L512 288 H688 L808 168 H1010"/>
    <path class="lattice-line violet" pathLength="1" d="M188 552 H398 L512 432 H688 L806 552 H1012"/>
    <path class="lattice-line gold" pathLength="1" d="M260 360 H458 L548 360 H652 L742 360 H940"/>
    <path class="lattice-line cyan" pathLength="1" d="M396 168 L458 360 L398 552"/>
    <path class="lattice-line violet" pathLength="1" d="M808 168 L742 360 L806 552"/>
    <path class="lattice-line gold" pathLength="1" d="M512 288 L600 360 L512 432 M688 288 L600 360 L688 432"/>
    <rect class="inference-core" x="548" y="308" width="104" height="104" rx="22"/>
    <circle class="neural-node" cx="190" cy="168" r="13"/>
    <circle class="neural-node violet" cx="396" cy="168" r="13"/>
    <circle class="neural-node gold" cx="808" cy="168" r="13"/>
    <circle class="neural-node" cx="1010" cy="168" r="13"/>
    <circle class="neural-node gold" cx="260" cy="360" r="13"/>
    <circle class="neural-node" cx="458" cy="360" r="13"/>
    <circle class="neural-node violet" cx="742" cy="360" r="13"/>
    <circle class="neural-node gold" cx="940" cy="360" r="13"/>
    <circle class="neural-node violet" cx="188" cy="552" r="13"/>
    <circle class="neural-node" cx="398" cy="552" r="13"/>
    <circle class="neural-node gold" cx="806" cy="552" r="13"/>
    <circle class="neural-node" cx="1012" cy="552" r="13"/>
  </g>
</svg>
