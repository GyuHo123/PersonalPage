<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Innovator orbital systems mark">
  <title>AI Innovator orbital systems mark</title>
  <desc>Original neural-orbit SVG animation representing agentic workflows, private AI infrastructure, and traceable backend systems.</desc>
  <style>
    :root { color-scheme: dark; }
    .orbit-ring,
    .circuit-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pathLength: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw-circuit 6.8s ease-in-out infinite alternate;
    }
    .orbit-ring {
      stroke: rgba(125, 249, 255, 0.62);
      stroke-width: 3.5;
      transform-origin: 600px 360px;
      animation: draw-circuit 6.8s ease-in-out infinite alternate, orbit-pulse 5.4s ease-in-out infinite;
    }
    .circuit-line {
      stroke: rgba(247, 155, 18, 0.88);
      stroke-width: 5;
    }
    .circuit-line.secondary {
      stroke: rgba(140, 105, 255, 0.82);
      stroke-width: 4;
      animation-delay: 0.28s;
    }
    .neural-node {
      fill: #05070d;
      stroke: #7df9ff;
      stroke-width: 4;
      transform-origin: center;
      animation: node-breathe 3.4s ease-in-out infinite;
    }
    .neural-node.hot {
      stroke: #f79b12;
      animation-delay: 0.42s;
    }
    .core {
      fill: url(#coreGlow);
      stroke: rgba(255, 255, 255, 0.88);
      stroke-width: 2;
    }
    @keyframes draw-circuit {
      0% { stroke-dashoffset: 1; opacity: 0.08; }
      16% { opacity: 1; }
      58%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes orbit-pulse {
      0%, 100% { opacity: 0.38; transform: rotate(0deg) scale(0.985); }
      50% { opacity: 0.88; transform: rotate(2deg) scale(1.015); }
    }
    @keyframes node-breathe {
      0%, 100% { r: 10; opacity: 0.68; }
      50% { r: 14; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-ring,
      .circuit-line,
      .neural-node {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7df9ff"/>
      <stop offset="72%" stop-color="#8c69ff"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#05070d"/>
  <g filter="url(#softGlow)">
    <path class="orbit-ring" pathLength="1" d="M176 359 C176 227 368 121 603 121 C838 121 1029 227 1029 359 C1029 491 838 598 603 598 C368 598 176 491 176 359 Z"/>
    <path class="orbit-ring" pathLength="1" d="M264 184 C391 95 626 145 790 295 C954 445 986 640 860 683 C733 726 497 675 334 526 C170 376 137 273 264 184 Z"/>
    <path class="orbit-ring" pathLength="1" d="M904 173 C1037 265 1001 448 823 582 C646 716 395 733 294 620 C193 507 282 308 459 174 C637 40 772 82 904 173 Z"/>
    <path class="circuit-line" pathLength="1" d="M243 363 L382 363 C422 363 431 313 469 313 L566 313 C592 313 599 273 626 273 L744 273 C790 273 800 223 838 223 L966 223"/>
    <path class="circuit-line secondary" pathLength="1" d="M254 496 L356 496 C399 496 411 443 454 443 L561 443 C604 443 612 398 652 398 L753 398 C799 398 816 345 858 345 L963 345"/>
    <path class="circuit-line" pathLength="1" d="M384 158 L454 226 L530 226 L600 360 L679 493 L758 493 L830 562"/>
    <path class="circuit-line secondary" pathLength="1" d="M811 146 L741 220 L681 220 L600 360 L520 503 L452 503 L378 579"/>
    <circle class="core" cx="600" cy="360" r="58"/>
    <circle class="neural-node hot" cx="243" cy="363" r="11"/>
    <circle class="neural-node" cx="469" cy="313" r="11"/>
    <circle class="neural-node hot" cx="626" cy="273" r="11"/>
    <circle class="neural-node" cx="838" cy="223" r="11"/>
    <circle class="neural-node" cx="254" cy="496" r="11"/>
    <circle class="neural-node hot" cx="652" cy="398" r="11"/>
    <circle class="neural-node" cx="963" cy="345" r="11"/>
    <circle class="neural-node" cx="384" cy="158" r="11"/>
    <circle class="neural-node hot" cx="830" cy="562" r="11"/>
  </g>
</svg>
